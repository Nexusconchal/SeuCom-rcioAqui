name: Testes do SeuComércioAqui
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verificar sintaxe Python e JavaScript
        run: |
          python -m compileall -q app.py seed.py tests
          node --check static/ui.js
          node --check static/app.js
          node --check static/menu.js
          node --check static/dashboard.js
      - name: Testar API e navegador
        run: python -m pytest -v
      - name: Auditar dependências de produção
        run: pip-audit -r requirements.txt
      - name: Construir e testar container de produção
        run: |
          docker build -t seucomercio-ci .
          docker run -d --rm --name seucomercio-smoke -p 8010:8000 -e APP_ENV=production -e SECRET_KEY=ci-only-secret-with-more-than-32-characters -e PUBLIC_URL=https://example.test -e TRUSTED_HOSTS=localhost,127.0.0.1 seucomercio-ci
          python scripts/smoke.py http://127.0.0.1:8010
          docker logs seucomercio-smoke
          docker stop seucomercio-smoke
      - name: Imagens para inspeção visual
        if: always()
        run: python scripts/preview_images.py
      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-seucomercio
          path: artifacts/
          if-no-files-found: ignore
