name: Testes do SeuComércioAqui
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verificar sintaxe Python e JavaScript
        run: |
          python -m compileall -q app.py seed.py inventory.py marketing.py migrations.py operations.py merchandising.py purchasing.py cashback.py campaign_queue.py customer_segments.py credit.py delivery_map.py shipping.py inbox.py production.py store_network.py marketing_worker.py tests
          node --check static/printing.js
          node --check static/search.js
          node --check static/quick-navigation.js
          node --test tests/search.test.mjs
          node --check static/ui.js
          node --check static/app.js
          node --check static/menu.js
          node --check static/dashboard.js
          node --check static/management.js
          node --check static/growth.js
          node --check static/inventory.js
          node --check static/shopping.js
          node --check static/operations.js
          node --check static/wallet.js
          node --check static/inbox.js
          node --check static/delivery.js
          node --check static/shipping.js
          node --check static/network.js
      - name: Testar API e navegador
        run: python -m pytest -v
      - name: Auditar dependências de produção
        run: pip-audit -r requirements.txt
      - name: Construir e testar container de produção
        run: |
          docker build -t seucomercio-ci .
          docker run -d --rm --name seucomercio-smoke -p 8010:8000 -e APP_ENV=production -e SECRET_KEY=ci-only-secret-with-more-than-32-characters -e PUBLIC_URL=https://example.test -e TRUSTED_HOSTS=localhost,127.0.0.1 seucomercio-ci
          python scripts/smoke.py http://127.0.0.1:8010
          docker logs seucomercio-smoke
          docker stop seucomercio-smoke
      - name: Imagens para inspeção visual
        if: always()
        run: python scripts/preview_images.py
      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-seucomercio
          path: artifacts/
          if-no-files-found: ignore

  windows-api:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar sintaxe e API no Windows
        run: |
          python -m compileall -q app.py seed.py tests scripts
          python -m pytest tests/test_api.py tests/test_business.py tests/test_billing_dates.py tests/test_growth.py tests/test_operations.py tests/test_credit_delivery.py tests/test_wallet_campaigns.py tests/test_inbox.py tests/test_network_production.py -v

  postgres-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-database-password@localhost:5432/commerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testar PostgreSQL, estoque concorrente e isolamento
        run: python -m pytest tests/test_api.py tests/test_business.py tests/test_billing_dates.py tests/test_growth.py tests/test_storage.py tests/test_postgres_access.py tests/test_operations.py tests/test_credit_delivery.py tests/test_wallet_campaigns.py tests/test_inbox.py tests/test_network_production.py -v

  storage-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar autenticação, caminhos e limite de upload
        run: deno test --allow-env supabase/functions/commerce-upload/index_test.ts
